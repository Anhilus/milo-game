<!DOCTYPE html>
<html lang="en" style="color-scheme:light!important;background:#FF0080!important">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#FF0080">
    <title>Milo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF1493;
            --blue: #00FFFF;
            --green: #32CD32;
            --gold: #FFD700;
            --purple: #9D00FF;
            --orange: #FF6B00;
            --cyan: #00E5FF;
            --lime: #CCFF00;
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(-45deg, #FF1493, #00FFFF, #32CD32, #9D00FF, #FF6B00) !important;
            background-size: 500% 500% !important;
            animation: gradientBG 12s ease infinite;
            color: #ffffff !important;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            will-change: background-position;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            z-index: 100;
            user-select: none;
        }

        .screen {
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 4px solid rgba(255,255,255,0.6);
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            text-shadow: 4px 4px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            border: 4px solid #000;
            border-radius: 15px;
            margin-bottom: 20px;
            outline: none;
            background: #ffffff !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2);
        }

        .toggle-container {
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
        }

        .toggle {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background: #000;
            border-radius: 20px;
            padding: 5px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle-btn.active {
            background: var(--pink);
            color: #fff;
            box-shadow: 0 0 15px rgba(255,20,147,0.7);
            transform: scale(1.05);
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            padding: 15px 30px;
            border: 4px solid #000;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 8px 0px #000;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-width: 150px;
            min-height: 50px;
            will-change: transform, box-shadow;
        }

        .btn:active {
            transform: translateY(4px) !important;
            box-shadow: 4px 4px 0px #000 !important;
        }

        .btn-action {
            background: var(--gold);
            color: #000;
        }
        .btn-action:hover {
            background: #FFEA00;
        }

        /* Screen 3 specialized styles */
        #screen3 {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            overflow: hidden;
        }

        .game-question {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            font-size: 2.5rem;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .game-btn-container {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
            z-index: 20;
        }

        .btn-win {
            background: var(--green);
            color: white;
            animation: pulseWin 2s infinite;
        }

        @keyframes pulseWin {
            0% { box-shadow: 0 0 0 0 rgba(50, 205, 50, 0.7), 4px 8px 0px #000; }
            70% { box-shadow: 0 0 0 25px rgba(50, 205, 50, 0), 4px 8px 0px #000; }
            100% { box-shadow: 0 0 0 0 rgba(50, 205, 50, 0), 4px 8px 0px #000; }
        }

        .btn-lose {
            background: #FF1493 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        .btn-win {
            background: #32CD32 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        .btn-action {
            background: #FFD700 !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }

        /* Frustration Meter */
        #frustration-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 200;
            border-bottom: 3px solid #000;
        }

        #frustration-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #32CD32, #CCFF00, #FFD700, #FF6B00, #FF1493, #9D00FF);
            background-size: 300% 100%;
            animation: frustrationShift 2s ease infinite;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(255,20,147,0.9);
        }

        @keyframes frustrationShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Taunt Messages with Emojis */
        .taunt {
            position: absolute;
            color: white;
            font-size: 1.9rem;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000, 2px 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: floatUp 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            z-index: 50;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.3) rotate(10deg); }
        }

        /* Credit Styling */
        .credit {
            font-size: 2.2rem;
            margin: 30px 0;
            text-align: center;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFEA00, #FFD700);
            background-size: 300% auto;
            color: #FFD700;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 3s linear infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4));
        }

        @keyframes goldShine {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .btn { font-size: 1.2rem; padding: 12px 24px; }
            .game-question { font-size: 2rem; top: 10%; }
            .credit { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div id="logo">🎮 Milo</div>

    <div id="frustration-container">
        <div id="frustration-bar"></div>
    </div>

    <!-- SCREEN 1: QUESTION CREATION -->
    <div id="screen1" class="screen" style="display:none;">
        <h1>Create Your Milo</h1>
        <input type="text" id="q-input" placeholder="Am I the most handsome person?" maxlength="80">
        <div class="toggle-container">
            <span>Which answer should win?</span>
            <div class="toggle">
                <button id="toggle-yes" class="toggle-btn active">YES</button>
                <button id="toggle-no" class="toggle-btn">NO</button>
            </div>
        </div>
        <button id="create-btn" class="btn btn-action" style="margin-bottom: 10px;">🎮 Generate Link</button>
        
        <!-- Share Section -->
        <div id="share-section" style="display:none; margin-top: 10px; width: 100%; flex-direction: column; align-items: center;">
            <h3 style="margin: 10px 0; font-size: 1.5rem; text-shadow: 2px 2px 0 #000;">Game Link Ready!</h3>
            <input type="text" id="share-link-input" readonly style="width: 90%; font-size: 1rem; text-align: center; margin-bottom: 15px; background: rgba(0,0,0,0.5); color: white; border: 2px solid #fff; box-shadow: none;">
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="copy-btn" class="btn" style="padding: 10px 15px; min-width: 100px; font-size: 1.2rem; background: var(--pink); color: white;">📋 Copy</button>
                <button id="share-api-btn" class="btn" style="padding: 10px 15px; min-width: 100px; font-size: 1.2rem; background: var(--blue); color: black; display: none;">📤 Share</button>
                <button id="play-self-btn" class="btn btn-action" style="padding: 10px 15px; min-width: 100px; font-size: 1.2rem;">🎮 Play</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: PLAYER VIEW PROMPT -->
    <div id="screen2" class="screen" style="display:none;">
        <h1 id="question-text"></h1>
        <button id="answer-btn" class="btn btn-action">💬 Answer This</button>
    </div>

    <!-- SCREEN 3: THE GAME -->
    <div id="screen3" style="display:none;">
        <h1 id="game-question" class="game-question"></h1>
        
        <div id="win-btn-container" class="game-btn-container">
            <button id="win-btn" class="btn btn-win">YES</button>
        </div>
        
        <div id="lose-btn-container" class="game-btn-container">
            <button id="lose-btn" class="btn btn-lose">NO</button>
        </div>
    </div>

    <!-- SCREEN 4: VICTORY MESSAGE -->
    <div id="screen4" class="screen" style="display:none;">
        <h1 class="victory-title">I Knew You'd Agree! 😎</h1>
        <div class="credit">✨ Developed by Arsalan ✨</div>
        <button id="restart-btn" class="btn btn-action">🔄 Create Your Own Milo</button>
    </div>

    <script>
        // Utilities and State
        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get('q');
        const w = urlParams.get('w'); // 'yes' or 'no'

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const screen4 = document.getElementById('screen4');

        let winningAnswer = 'yes'; 
        let audioCtx;

        // Init Routing
        if (q && w) {
            screen2.style.display = 'flex';
            document.getElementById('question-text').innerText = decodeURIComponent(q);
            winningAnswer = w.toLowerCase();
        } else {
            screen1.style.display = 'flex';
        }

        // --- SCREEN 1 LOGIC ---
        let selectedWinner = 'yes';
        
        const toggleYes = document.getElementById('toggle-yes');
        const toggleNo = document.getElementById('toggle-no');
        
        toggleYes.addEventListener('click', (e) => {
            selectedWinner = 'yes';
            e.target.classList.add('active');
            toggleNo.classList.remove('active');
        });
        
        toggleNo.addEventListener('click', (e) => {
            selectedWinner = 'no';
            e.target.classList.add('active');
            toggleYes.classList.remove('active');
        });

        const createBtn = document.getElementById('create-btn');
        createBtn.addEventListener('click', () => {
            let input = document.getElementById('q-input').value.trim();
            if (!input) input = document.getElementById('q-input').placeholder;
            
            const newUrl = window.location.origin + window.location.pathname + `?q=${encodeURIComponent(input)}&w=${selectedWinner}`;
            
            // Show share UI
            createBtn.style.display = 'none';
            const shareSec = document.getElementById('share-section');
            shareSec.style.display = 'flex';
            
            const linkInput = document.getElementById('share-link-input');
            linkInput.value = newUrl;
            
            document.getElementById('copy-btn').onclick = () => {
                linkInput.select();
                linkInput.setSelectionRange(0, 99999);
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(newUrl).then(() => {
                        document.getElementById('copy-btn').innerText = '✅ Copied!';
                        setTimeout(() => document.getElementById('copy-btn').innerText = '📋 Copy', 2000);
                    });
                } else {
                    document.execCommand('copy');
                    document.getElementById('copy-btn').innerText = '✅ Copied!';
                    setTimeout(() => document.getElementById('copy-btn').innerText = '📋 Copy', 2000);
                }
            };
            
            if (navigator.share) {
                const shareApiBtn = document.getElementById('share-api-btn');
                shareApiBtn.style.display = 'block';
                shareApiBtn.onclick = () => {
                    navigator.share({
                        title: 'Milo - The Fun Game',
                        text: 'I created a fun game for you! Play it now:',
                        url: newUrl
                    }).catch(console.error);
                };
            }
            
            document.getElementById('play-self-btn').onclick = () => {
                window.location.href = newUrl;
            };
        });

        // --- SCREEN 2 LOGIC ---
        function initGameTransition() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            screen2.style.display = 'none';
            startScreen3();
        }

        const answerBtn = document.getElementById('answer-btn');
        answerBtn.addEventListener('click', initGameTransition);
        answerBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initGameTransition();
        }, { passive: false, once: true });

        // --- SCREEN 3 LOGIC (THE GAME) ---
        let gameActive = false;
        let loseScale = 1, winScale = 1;
        let loseX = 0, loseY = 0, targetLoseX = 0, targetLoseY = 0;
        let winPosX = 0, winPosY = 0; // win button fixed position
        let winCurrentScale = 1, loseCurrentScale = 1;
        let loseTargetScale = 1, winTargetScale = 1;
        let frustration = 0;
        let mouseX = -1000, mouseY = -1000;
        let won = false;
        // Cached DOM refs for game loop
        let loseBtnC, winBtnC;

        // Lightweight lerp function — no library needed
        function lerp(a, b, t) { return a + (b - a) * t; }

        const handleMove = e => { mouseX = e.clientX; mouseY = e.clientY; };
        const handleTouchMove = e => { if (e.touches.length > 0) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } };
        const handleTouchStart = e => { if (e.touches.length > 0) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } };
        const handleTouchEnd = () => { mouseX = -1000; mouseY = -1000; };

        document.addEventListener('mousemove', handleMove, { passive: true });
        document.addEventListener('touchmove', handleTouchMove, { passive: true });
        document.addEventListener('touchstart', handleTouchStart, { passive: true });
        document.addEventListener('touchend', handleTouchEnd, { passive: true });

        function setTransform(el, x, y, scale) {
            el.style.transform = `translate(calc(${x}px - 50%), calc(${y}px - 50%)) scale(${scale})`;
        }

        function startScreen3() {
            screen3.style.display = 'block';
            document.getElementById('frustration-container').style.display = 'block';
            document.getElementById('game-question').innerText = decodeURIComponent(q);

            winBtnC = document.getElementById('win-btn-container');
            loseBtnC = document.getElementById('lose-btn-container');
            const winBtn = document.getElementById('win-btn');
            const loseBtn = document.getElementById('lose-btn');

            if (winningAnswer === 'yes') {
                winBtn.innerText = 'YES'; loseBtn.innerText = 'NO';
            } else {
                winBtn.innerText = 'NO'; loseBtn.innerText = 'YES';
            }

            let cx = window.innerWidth / 2;
            let cy = window.innerHeight * 0.6;

            if (window.innerWidth < 600) {
                winPosX = cx; winPosY = cy - 80;
                loseX = cx; loseY = cy + 80;
            } else {
                winPosX = cx - 150; winPosY = cy;
                loseX = cx + 150; loseY = cy;
            }

            loseCurrentScale = 1; winCurrentScale = 1;
            loseTargetScale = 1; winTargetScale = 1;
            setTransform(winBtnC, winPosX, winPosY, 1);
            setTransform(loseBtnC, loseX, loseY, 1);
            targetLoseX = loseX; targetLoseY = loseY;

            loseBtnC.addEventListener('mouseenter', () => forceRunAway(true));
            loseBtnC.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if(gameActive) forceRunAway(true);
            }, { passive: false });
            winBtnC.addEventListener('click', winGame);
            winBtnC.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if(gameActive) winGame();
            }, { passive: false });

            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        let lastRunAwayTime = 0;
        function forceRunAway(ignoreDebounce = false) {
            if (!gameActive) return;
            let now = Date.now();
            let debounceTime = ignoreDebounce ? 50 : 250;
            if (now - lastRunAwayTime < debounceTime) return;
            lastRunAwayTime = now;

            targetLoseX = (0.1 + Math.random() * 0.8) * window.innerWidth;
            targetLoseY = (0.2 + Math.random() * 0.65) * window.innerHeight;
            increaseFrustration();
        }

        function increaseFrustration() {
            frustration = Math.min(100, frustration + 10);
            document.getElementById('frustration-bar').style.width = frustration + '%';
            showTaunt(loseX, loseY);
            if (navigator.vibrate && frustration < 100) navigator.vibrate(30);
            loseTargetScale = Math.max(0.4, loseTargetScale - 0.03);
            winTargetScale  = Math.min(1.5, winTargetScale  + 0.04);
        }

        function gameLoop() {
            if (!gameActive) return;

            loseX = lerp(loseX, targetLoseX, 0.15);
            loseY = lerp(loseY, targetLoseY, 0.15);

            loseCurrentScale = lerp(loseCurrentScale, loseTargetScale, 0.05);
            winCurrentScale  = lerp(winCurrentScale,  winTargetScale,  0.05);

            setTransform(loseBtnC, loseX, loseY, loseCurrentScale);
            setTransform(winBtnC, winPosX, winPosY, winCurrentScale);

            let dist = Math.hypot(mouseX - loseX, mouseY - loseY);
            let threshold = 100 * loseCurrentScale + (window.innerWidth < 600 ? 50 : 30);
            if (dist < threshold) forceRunAway();

            requestAnimationFrame(gameLoop);
        }

        function showTaunt(x, y) {
            const taunts = [
                "🙈 Nice try!",
                "😜 Close!",
                "🤣 Nope!",
                "😅 Too slow!",
                "🎯 Almost!",
                "😂 Sike!",
                "🫣 Missed!",
                "💨 Whoops!",
                "😏 Try again!",
                "🙃 Haha!"
            ];
            const t = document.createElement('div');
            t.className = 'taunt';
            t.innerText = taunts[Math.floor(Math.random() * taunts.length)];
            t.style.left = x + 'px';
            t.style.top = (y - 30) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1000);
        }

        // --- SCREEN 4 LOGIC (VICTORY) ---
        function winGame() {
            if (won || !gameActive) return;
            won = true;
            gameActive = false;
            
            document.getElementById('frustration-container').style.display = 'none';
            screen3.style.display = 'none';
            screen4.style.display = 'flex';
            
            playVictorySound();
            confettiActive = true;
            initConfetti();
            renderConfetti();
        }

        function restartApp() {
            window.location.href = window.location.origin + window.location.pathname;
        }

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', restartApp);
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restartApp();
        }, { passive: false, once: true });

        // --- AUDIO SYSTEM ---
        function playVictorySound() {
            if (!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const playNote = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            
            const now = audioCtx.currentTime;
            playNote(523.25, now, 0.2); // C5
            playNote(659.25, now + 0.1, 0.2); // E5
            playNote(783.99, now + 0.2, 0.4); // G5
            playNote(1046.50, now + 0.3, 0.6); // C6
        }

        // --- CONFETTI SYSTEM (Lightweight & Optimized) ---
        let confettiActive = false;
        let canvas, ctx;
        let confettis = [];

        function initConfetti() {
            canvas = document.createElement('canvas');
            canvas.id = 'confetti-canvas';
            document.body.appendChild(canvas);
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9999';

            // Vibrant colors with new palette
            const colors = ['#FF1493', '#00FFFF', '#32CD32', '#FFD700', '#FFFFFF', '#9D00FF', '#FF6B00', '#CCFF00'];
            
            for(let i=0; i<50; i++) {
                confettis.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 8 + 4,
                    h: Math.random() * 8 + 4,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    v: Math.random() * 3 + 2,
                    a: Math.random() * 360,
                    s: Math.random() * 0.06 + 0.02
                });
            }
        }

        function renderConfetti() {
            if(!confettiActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<confettis.length; i++) {
                const c = confettis[i];
                c.y += c.v;
                c.a += c.s;
                if(c.y > canvas.height) {
                    c.y = -20;
                    c.x = Math.random() * canvas.width;
                }
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.a);
                ctx.fillStyle = c.c;
                ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
                ctx.restore();
            }
            requestAnimationFrame(renderConfetti);
        }
    </script>
</body>
